<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
    <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
    {{ with .Params.keywords }}
    <meta name="keywords" content="{{ delimit . ", " }}">
    {{ end }}
    <meta name="robots" content="index, follow">
    <meta name="author" content="Xavi Alonso · Solutech">
    
    <link rel="canonical" href="{{ .Permalink }}">
    <meta name="theme-color" content="#07070b">

    <!-- Open Graph -->
    <meta property="og:title" content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}">
    <meta property="og:description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
    <meta property="og:type" content="{{ if .IsHome }}website{{ else }}article{{ end }}">
    <meta property="og:url" content="{{ .Permalink }}">
    <meta property="og:locale" content="es_ES">
    <meta property="og:image" content="{{ with .Params.image }}{{ . | absURL }}{{ else }}{{ "favicon.png" | absURL }}{{ end }}">

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}">
    <meta name="twitter:description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
    <meta name="twitter:image" content="{{ with .Params.image }}{{ . | absURL }}{{ else }}{{ "favicon.png" | absURL }}{{ end }}">

    <!-- CSS Maestro -->
    {{ $styles := resources.Get "css/main.css" | minify | fingerprint }}
    <link rel="stylesheet" href="{{ $styles.RelPermalink }}" integrity="{{ $styles.Data.Integrity }}">
    
    <!-- Favicon & Icons -->
    <link rel="icon" type="image/x-icon" href="{{ "favicon.ico" | relURL }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ "favicon-16x16.png" | relURL }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ "favicon-32x32.png" | relURL }}">
    <link rel="icon" type="image/png" sizes="48x48" href="{{ "favicon-48x48.png" | relURL }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ "apple-touch-icon.png" | relURL }}">
    <link rel="manifest" href="{{ "site.webmanifest" | relURL }}">

    <!-- Schema.org LocalBusiness -->
    {{ if .IsHome }}
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ProfessionalService",
      "name": "Solutech",
      "description": "{{ .Site.Params.description }}",
      "url": "{{ .Site.BaseURL }}",
      "email": "{{ .Site.Params.email }}",
      "telephone": "+34684248465",
      "image": "{{ "favicon.png" | absURL }}",
      "priceRange": "€€",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Calle Tamarchete 9",
        "addressLocality": "Lorca",
        "addressRegion": "Murcia",
        "postalCode": "30800",
        "addressCountry": "ES"
      },
      "areaServed": [
        {
          "@type": "AdministrativeArea",
          "name": "Murcia"
        },
        {
          "@type": "AdministrativeArea",
          "name": "Almería"
        }
      ],
      "openingHoursSpecification": {
        "@type": "OpeningHoursSpecification",
        "dayOfWeek": [
          "Monday",
          "Tuesday",
          "Wednesday",
          "Thursday",
          "Friday"
        ],
        "opens": "09:00",
        "closes": "18:00"
      },
      "sameAs": [
        "{{ .Site.Params.social.linkedin }}",
        "{{ .Site.Params.social.instagram }}",
        "{{ .Site.Params.social.youtube }}",
        "{{ .Site.Params.social.github }}"
      ]
    }
    </script>
    {{ end }}
    
    <!-- Schema.org BlogPosting -->
    {{ if eq .Section "blog" }}
    {{ if .IsPage }}
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "BlogPosting",
      "headline": "{{ .Title }}",
      "description": "{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}",
      "image": "{{ with .Params.image }}{{ . | absURL }}{{ else }}{{ "favicon.png" | absURL }}{{ end }}",
      "datePublished": "{{ .Date.Format "2006-01-02T15:04:05-07:00" }}",
      {{ with .Lastmod }}
      "dateModified": "{{ .Format "2006-01-02T15:04:05-07:00" }}",
      {{ end }}
      "author": {
        "@type": "Person",
        "name": "Xavi Alonso"
      },
      "publisher": {
        "@type": "Organization",
        "name": "Solutech",
        "logo": {
          "@type": "ImageObject",
          "url": "{{ "favicon.png" | absURL }}"
        }
      },
      "mainEntityOfPage": {
        "@type": "WebPage",
        "@id": "{{ .Permalink }}"
      }
    }
    </script>
    {{ end }}
    {{ end }}
    <!-- Google Analytics & Consent Mode v2 -->
    {{ if .Site.Params.integrations.google_analytics }}
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      
      // Bloqueamos la recolección de datos por defecto (RGPD)
      gtag('consent', 'default', {
        'analytics_storage': 'denied',
        'ad_storage': 'denied',
        'ad_user_data': 'denied',
        'ad_personalization': 'denied',
        'wait_for_update': 500
      });

      // Si el usuario ya aceptó antes, actualizamos el estado
      if (localStorage.getItem('solutech_cookie_consent') === 'granted') {
        gtag('consent', 'update', {
          'analytics_storage': 'granted',
          'ad_storage': 'granted',
          'ad_user_data': 'granted',
          'ad_personalization': 'granted'
        });
      }

      gtag('js', new Date());
      gtag('config', '{{ .Site.Params.integrations.google_analytics }}');
    </script>
    <script async src="https://www.googletagmanager.com/gtag/js?id={{ .Site.Params.integrations.google_analytics }}"></script>
    {{ end }}
</head>
