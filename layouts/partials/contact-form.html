<form id="solutech-contact-form" action="https://n8n.solutech.blog/webhook/leads" method="POST" class="cta-form">
  <div class="form-row">
    <input type="text" name="nombre" placeholder="Tu nombre" aria-label="Tu nombre completo" required class="cta-input">
    <input type="email" name="email" placeholder="Tu email" aria-label="Tu correo electrónico" required class="cta-input">
  </div>
  <div class="form-row">
    <input type="tel" name="telefono" placeholder="Teléfono" aria-label="Teléfono de contacto" required class="cta-input">
    <input type="text" name="empresa" placeholder="Tu empresa (opcional)" aria-label="Nombre de tu empresa (opcional)" class="cta-input">
  </div>
  
  <textarea name="mensaje" placeholder="¿En qué podemos ayudarte? o ¿cuál es tu consulta?" aria-label="Detalla en qué podemos ayudarte" required class="cta-input cta-textarea"></textarea>
  
  <button type="submit" class="cta-btn" id="contact-submit-btn">
    Solicitar Diagnóstico Gratuito 
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
  </button>
  <div id="contact-status" style="margin-top: 16px; font-size: 14px; text-align: center; display: none;"></div>
</form>

<script>
  document.getElementById("solutech-contact-form").addEventListener("submit", function(event) {
    event.preventDefault();
    var form = event.target;
    var btn = document.getElementById("contact-submit-btn");
    var status = document.getElementById("contact-status");
    
    btn.innerHTML = "Enviando... <svg width='13' height='13' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2'><path d='M12 2v4m0 12v4M4.93 4.93l2.83 2.83m8.48 8.48l2.83 2.83M2 12h4m12 0h4M4.93 19.07l2.83-2.83m8.48-8.48l2.83-2.83'/></svg>";
    btn.style.opacity = "0.7";
    btn.disabled = true;

    var data = new FormData(form);
    fetch(form.action, {
      method: form.method,
      body: data,
      headers: {
        'Accept': 'application/json'
      }
    }).then(response => {
      if (response.ok) {
        status.innerHTML = "<strong style='color: #4ade80;'>✓ Solicitud enviada correctamente.</strong><br>He recibido tu información. En menos de 24h me pondré en contacto contigo.";
        status.style.display = "block";
        form.reset();
        btn.innerHTML = "Solicitar Diagnóstico Gratuito <svg width='13' height='13' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2'><path d='M5 12h14M12 5l7 7-7 7'/></svg>";
        btn.style.opacity = "1";
        btn.disabled = false;
        btn.style.display = "none"; // Hide button after success
      } else {
        response.json().then(data => {
          if (Object.hasOwn(data, 'errors')) {
            status.innerHTML = "<span style='color: #f87116;'>Error al enviar: Revisa los campos requeridos.</span>";
          } else {
            status.innerHTML = "<span style='color: #f87116;'>Hubo un problema al enviar el formulario.</span>";
          }
          status.style.display = "block";
          btn.innerHTML = "Solicitar Diagnóstico Gratuito <svg width='13' height='13' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2'><path d='M5 12h14M12 5l7 7-7 7'/></svg>";
          btn.style.opacity = "1";
          btn.disabled = false;
        })
      }
    }).catch(error => {
      status.innerHTML = "<span style='color: #f87116;'>Hubo un error de conexión. Inténtalo de nuevo.</span>";
      status.style.display = "block";
      btn.innerHTML = "Solicitar Diagnóstico Gratuito <svg width='13' height='13' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2'><path d='M5 12h14M12 5l7 7-7 7'/></svg>";
      btn.style.opacity = "1";
      btn.disabled = false;
    });
  });
</script>
