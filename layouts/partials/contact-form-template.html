{{ $type := .type | default "lead" }}
<form id="solutech-{{ $type }}-form" action="https://n8n.solutech.blog/webhook/leads" method="POST" class="cta-form" data-type="{{ $type }}">
  <div class="form-row">
    <div class="form-group">
      <label for="nombre-{{ $type }}" class="sr-only">Nombre / Empresa</label>
      <input type="text" id="nombre-{{ $type }}" name="nombre" placeholder="{{ if eq $type "support" }}Tu nombre o empresa{{ else }}Tu nombre{{ end }}" aria-label="Tu nombre completo" required class="cta-input">
    </div>
    <div class="form-group">
      <label for="email-{{ $type }}" class="sr-only">Tu Email</label>
      <input type="email" id="email-{{ $type }}" name="email" placeholder="Tu email" aria-label="Tu correo electrónico" required class="cta-input">
    </div>
  </div>
  
  {{ if eq $type "lead" }}
  <div class="form-row">
    <div class="form-group">
      <label for="telefono-{{ $type }}" class="sr-only">Teléfono</label>
      <input type="tel" id="telefono-{{ $type }}" name="telefono" placeholder="Teléfono" aria-label="Teléfono de contacto" required class="cta-input">
    </div>
    <div class="form-group">
      <label for="empresa-{{ $type }}" class="sr-only">Tu Empresa (opcional)</label>
      <input type="text" id="empresa-{{ $type }}" name="empresa" placeholder="Tu empresa (opcional)" aria-label="Nombre de tu empresa (opcional)" class="cta-input">
    </div>
  </div>
  <div class="form-row">
    <div class="form-group">
      <label for="empleados-{{ $type }}" class="sr-only">Número de empleados</label>
      <select id="empleados-{{ $type }}" name="empleados" class="cta-input" aria-label="Número de empleados">
        <option value="" disabled selected>Nº de empleados</option>
        <option value="1">Solo yo (autónomo)</option>
        <option value="2-5">2 – 5 empleados</option>
        <option value="6-20">6 – 20 empleados</option>
        <option value="21-50">21 – 50 empleados</option>
        <option value="50+">Más de 50</option>
      </select>
    </div>
    <div class="form-group">
      <label for="sector-{{ $type }}" class="sr-only">Sector</label>
      <select id="sector-{{ $type }}" name="sector" class="cta-input" aria-label="Sector de la empresa">
        <option value="" disabled selected>Sector</option>
        <option value="comercio">Comercio / Retail</option>
        <option value="hosteleria">Hostelería / Restauración</option>
        <option value="salud">Salud / Clínica</option>
        <option value="despacho">Despacho / Asesoría</option>
        <option value="industria">Industria / Logística</option>
        <option value="educacion">Educación</option>
        <option value="otro">Otro</option>
      </select>
    </div>
  </div>
  <div class="form-row">
    <div class="form-group" style="flex: 1;">
      <label for="preocupacion-{{ $type }}" class="sr-only">Principal preocupación</label>
      <select id="preocupacion-{{ $type }}" name="preocupacion" class="cta-input" aria-label="Principal preocupación tecnológica">
        <option value="" disabled selected>¿Cuál es tu mayor problema tecnológico?</option>
        <option value="seguridad">Seguridad y ciberataques</option>
        <option value="soporte">Falta de soporte técnico</option>
        <option value="modernizacion">Sistemas obsoletos</option>
        <option value="coste">Costes de TI elevados</option>
        <option value="perdida-datos">Pérdida de datos / backups</option>
        <option value="conectividad">Problemas de red / conectividad</option>
        <option value="otro">Otro</option>
      </select>
    </div>
  </div>
  {{/* Honeypot anti-spam — invisible para humanos, visible para bots */}}
  <div aria-hidden="true" style="position:absolute;left:-9999px;top:-9999px;overflow:hidden;" tabindex="-1">
    <label for="website_url_{{ $type }}">No rellenar</label>
    <input type="text" id="website_url_{{ $type }}" name="website_url" autocomplete="off" tabindex="-1">
  </div>
  {{ end }}

  <div class="form-group">
    <label for="mensaje-{{ $type }}" class="sr-only">{{ if eq $type "support" }}Descripción del Problema{{ else }}Mensaje / Consulta{{ end }}</label>
    <textarea id="mensaje-{{ $type }}" name="{{ if eq $type "support" }}descripcion{{ else }}mensaje{{ end }}" placeholder="{{ if eq $type "support" }}Explica detalladamente la incidencia técnica...{{ else }}¿En qué podemos ayudarte? o ¿cuál es tu consulta?{{ end }}" aria-label="{{ if eq $type "support" }}Detalla la incidencia técnica{{ else }}Detalla en qué podemos ayudarte{{ end }}" required class="cta-input cta-textarea"></textarea>
  </div>

  <button type="submit" class="cta-btn" id="{{ $type }}-submit-btn">
    {{ if eq $type "support" }}Abrir Ticket{{ else }}Solicitar Diagnóstico Gratuito{{ end }}
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
  </button>
  <div id="{{ $type }}-status" class="form-status" style="margin-top: 16px; font-size: 14px; text-align: center; display: none;"></div>
</form>
