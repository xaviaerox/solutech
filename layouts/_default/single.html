{{ define "main" }}
<article class="hero r" style="min-height: auto; padding-bottom: 40px;">
  <div class="hero-inner" style="display: block; max-width: 800px;">
    <div class="section-tag">{{ range .Params.categories }}{{ . }}{{ end }}</div>
    <h1 class="hero-h1">{{ .Title }}</h1>
    <p class="hero-p" style="max-width: none; font-family: 'Geist Mono', monospace; font-size: 11px;">{{ .Date.Format "02 Jan 2006" }}</p>
  </div>
</article>

<section class="about r" style="padding-top: 0;">
  <div class="about-content" style="max-width: 800px; margin: 0 auto; font-size: 16px; line-height: 1.8;">
    {{ .Content }}
  </div>
</section>
{{ end }}
