{{ define "main" }}
<div class="blog-container">
  <article class="blog-post r">
    <nav class="breadcrumbs" aria-label="Breadcrumbs" style="font-family: var(--f-m); font-size: 10px; margin-bottom: 24px; color: var(--ts); text-transform: uppercase; letter-spacing: 0.05em; display: flex; gap: 8px; align-items: center;">
      <a href="{{ "/" | relURL }}" style="color: var(--ts); text-decoration: none; transition: color 0.2s;" onmouseover="this.style.color='var(--o)'" onmouseout="this.style.color='var(--ts)'">Inicio</a>
      <span style="opacity: 0.5;">&gt;</span>
      <a href="{{ "/blog/" | relURL }}" style="color: var(--ts); text-decoration: none; transition: color 0.2s;" onmouseover="this.style.color='var(--o)'" onmouseout="this.style.color='var(--ts)'">Blog</a>
      <span style="opacity: 0.5;">&gt;</span>
      <span style="color: var(--tm); font-weight: 500;">{{ .Title }}</span>
    </nav>
    <header class="blog-header">
      <div class="section-tag">{{ range .Params.categories }}{{ . }}{{ end }}</div>
      <h1 class="blog-title">{{ .Title }}</h1>
      <div class="blog-meta">
        <time>{{ .Date.Format "02 Jan 2006" }}</time>
        <span>•</span>
        <span>Lectura Premium</span>
      </div>
    </header>

    <div class="blog-content">
      {{ .Content }}
    </div>
  </article>
</div>
{{ end }}
