{{ define "main" }}
<section class="blog" style="padding-top: 140px;">
  <div class="section-tag">Archivo</div>
  <h2 class="section-h">{{ .Title }}</h2>
  <div class="blog-grid" style="display: flex; flex-direction: column; gap: 24px;">
    {{ range .Pages }}
    <a href="{{ .RelPermalink }}" style="text-decoration: none; color: inherit;">
      <div class="bcard small">
        <div class="bcard-body">
          <div class="bcard-cat">{{ range .Params.categories }}{{ . }}{{ end }}</div>
          <h3 class="bcard-title">{{ .Title }}</h3>
          <p class="bcard-exc">{{ .Description }}</p>
          <div class="bcard-meta">{{ .Date.Format "02 Jan 2006" }}</div>
        </div>
      </div>
    </a>
    {{ end }}
  </div>
</section>
{{ end }}
