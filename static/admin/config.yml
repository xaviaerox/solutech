backend:
  name: github
  repo: xaviaerox/solutech
  branch: main
  # URL de tu OAuth provider alojado en el VPS de Solutech
  base_url: https://oauth.solutech.blog
  auth_endpoint: auth

media_folder: "static/images"
public_folder: "/images"

collections:
  # Colección Unificada: Artículos y Noticias
  - name: "blog"
    label: "Artículos y Noticias"
    folder: "content/blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Fecha de Publicación", name: "date", widget: "datetime", format: "YYYY-MM-DDTHH:mm:ssZZ" }
      - { label: "Slug URL", name: "slug", widget: "string" }
      - { label: "Descripción Corta (SEO)", name: "description", widget: "text" }
      - { label: "Categorías", name: "categories", widget: "list", default: ["Ciberseguridad"] }
      - { label: "Palabras Clave (Keywords)", name: "keywords", widget: "list", required: false }
      - { label: "Imagen Destacada", name: "image", widget: "image", required: false }
      - { label: "Borrador (Draft)", name: "draft", widget: "boolean", default: false }
      - { label: "Impacto en el Negocio (Noticias/Alertas)", name: "business_impact", widget: "text", required: false }
      - { label: "URL Fuente Original (Opcional)", name: "source_url", widget: "string", required: false }
      - { label: "Proyectos Vinculados (Slug de Soluciones)", name: "projects", widget: "list", required: false }
      - { label: "Cuerpo de la Publicación", name: "body", widget: "markdown" }

  # Colección: Guías Técnicas
  - name: "guias"
    label: "Guías Técnicas"
    folder: "content/guias"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Fecha de Publicación", name: "date", widget: "datetime", format: "YYYY-MM-DDTHH:mm:ssZZ" }
      - { label: "Slug URL", name: "slug", widget: "string" }
      - { label: "Descripción Corta (SEO)", name: "description", widget: "text" }
      - { label: "Categorías", name: "categories", widget: "list", default: ["Ciberseguridad", "Guías"] }
      - { label: "Palabras Clave (Keywords)", name: "keywords", widget: "list", required: false }
      - { label: "Imagen Destacada", name: "image", widget: "image", required: false }
      - { label: "Borrador (Draft)", name: "draft", widget: "boolean", default: false }
      - { label: "Cuerpo de la Guía", name: "body", widget: "markdown" }

  # Colección: Soluciones & Labs
  - name: "soluciones"
    label: "Soluciones & Labs"
    folder: "content/soluciones"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Slug URL", name: "slug", widget: "string" }
      - { label: "Subtítulo / Tagline", name: "tagline", widget: "string" }
      - { label: "Descripción Corta (SEO)", name: "description", widget: "text" }
      - { label: "Estado del Proyecto", name: "status", widget: "select", options: ["Demostración técnica", "Producción activa", "Validación comercial", "I+D / Experimental", "Interno"] }
      - { label: "Naturaleza de la Solución", name: "nature", widget: "string" }
      - { label: "Versión Auditada", name: "version", widget: "string" }
      - { label: "Patrón de Arquitectura", name: "architecture_pattern", widget: "string", required: false }
      - { label: "Coordinación / Cliente", name: "collaboration", widget: "string", required: false }
      - { label: "Stack Tecnológico", name: "stack", widget: "list" }
      - { label: "URL de Demostración", name: "demo_url", widget: "string", required: false }
      - { label: "Repositorio GitHub", name: "github_url", widget: "string", required: false }
      - { label: "Imagen Destacada", name: "image", widget: "image", required: false }
      - { label: "Borrador (Draft)", name: "draft", widget: "boolean", default: false }
      - { label: "Cuerpo / Caso de Estudio", name: "body", widget: "markdown" }

  # Colección de Datos: Reseñas y Testimonios de Portada
  - name: "data"
    label: "Datos de Portada y Reseñas"
    files:
      - name: "testimonials"
        label: "Reseñas y Testimonios"
        file: "data/testimonials.yaml"
        description: "Gestión de reseñas y casos reales de clientes mostrados en la página principal y en los datos estructurados SEO (Schema.org)."
        fields:
          - label: "Lista de Reseñas"
            name: "items"
            label_singular: "Reseña"
            widget: "list"
            summary: "{{fields.name}} — {{fields.role}} ({{fields.rating}}★)"
            fields:
              - { label: "Nombre del Cliente", name: "name", widget: "string", hint: "Ej: Conchi M." }
              - { label: "Cargo / Sector / Ciudad", name: "role", widget: "string", hint: "Ej: Director de Operaciones · Climatización — Murcia" }
              - { label: "Inicial del Avatar", name: "initial", widget: "string", required: false, hint: "Letra mayúscula para el avatar (si se deja vacío se toma la primera letra del nombre)" }
              - { label: "Calificación (1 a 5 estrellas)", name: "rating", widget: "number", default: 5, value_type: "int", min: 1, max: 5 }
              - { label: "Texto de la Reseña", name: "text", widget: "text" }
