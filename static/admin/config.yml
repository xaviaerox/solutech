backend:
  name: github
  repo: xaviaerox/solutech
  branch: main
  # URL de tu OAuth provider alojado en el VPS de Solutech
  base_url: https://oauth.solutech.blog
  auth_endpoint: auth

media_folder: "static/images"
public_folder: "/images"

collections:
  # Colección Unificada: Artículos y Noticias
  - name: "blog"
    label: "Artículos y Noticias"
    folder: "content/blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Fecha de Publicación", name: "date", widget: "datetime", format: "YYYY-MM-DDTHH:mm:ssZZ" }
      - { label: "Slug URL", name: "slug", widget: "string" }
      - { label: "Descripción Corta (SEO)", name: "description", widget: "text" }
      - { label: "Categorías", name: "categories", widget: "list", default: ["Ciberseguridad"] }
      - { label: "Palabras Clave (Keywords)", name: "keywords", widget: "list", required: false }
      - { label: "Imagen Destacada", name: "image", widget: "image", required: false }
      - { label: "Borrador (Draft)", name: "draft", widget: "boolean", default: false }
      - { label: "Impacto en el Negocio (Noticias/Alertas)", name: "business_impact", widget: "text", required: false }
      - { label: "URL Fuente Original (Opcional)", name: "source_url", widget: "string", required: false }
      - { label: "Cuerpo de la Publicación", name: "body", widget: "markdown" }

  # Colección: Guías Técnicas
  - name: "guias"
    label: "Guías Técnicas"
    folder: "content/guias"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Fecha de Publicación", name: "date", widget: "datetime", format: "YYYY-MM-DDTHH:mm:ssZZ" }
      - { label: "Slug URL", name: "slug", widget: "string" }
      - { label: "Descripción Corta (SEO)", name: "description", widget: "text" }
      - { label: "Categorías", name: "categories", widget: "list", default: ["Ciberseguridad", "Guías"] }
      - { label: "Palabras Clave (Keywords)", name: "keywords", widget: "list", required: false }
      - { label: "Imagen Destacada", name: "image", widget: "image", required: false }
      - { label: "Borrador (Draft)", name: "draft", widget: "boolean", default: false }
      - { label: "Cuerpo de la Guía", name: "body", widget: "markdown" }
