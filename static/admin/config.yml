backend:
  name: github
  repo: xaviaerox/solutech
  branch: main
  # URL de tu OAuth provider alojado en el VPS de Solutech
  base_url: https://oauth.solutech.blog
  auth_endpoint: auth

media_folder: "static/images"
public_folder: "/images"

collections:
  # Colección para el Blog Tradicional
  - name: "blog"
    label: "Artículos del Blog"
    folder: "content/blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Fecha de Publicación", name: "date", widget: "datetime", format: "YYYY-MM-DDTHH:mm:ssZZ" }
      - { label: "Slug URL", name: "slug", widget: "string" }
      - { label: "Descripción Corta (SEO)", name: "description", widget: "text" }
      - { label: "Categorías", name: "categories", widget: "list", default: ["Ciberseguridad"] }
      - { label: "Palabras Clave (Keywords)", name: "keywords", widget: "list" }
      - { label: "Imagen Destacada", name: "image", widget: "image" }
      - { label: "Borrador (Draft)", name: "draft", widget: "boolean", default: true }
      - { label: "Cuerpo del Artículo", name: "body", widget: "markdown" }

  # Colección para las Noticias del Bot (o manuales)
  - name: "news"
    label: "Noticias de Actualidad"
    folder: "content/news"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Fecha de Publicación", name: "date", widget: "datetime", format: "YYYY-MM-DDTHH:mm:ssZZ" }
      - { label: "Slug URL", name: "slug", widget: "string" }
      - { label: "Descripción Corta (SEO)", name: "description", widget: "text" }
      - { label: "Categorías", name: "categories", widget: "list", default: ["Ciberseguridad", "Noticias"] }
      - { label: "Palabras Clave (Keywords)", name: "keywords", widget: "list" }
      - { label: "Imagen Destacada", name: "image", widget: "image" }
      - { label: "Borrador (Draft)", name: "draft", widget: "boolean", default: true }
      - { label: "Impacto del Negocio", name: "business_impact", widget: "text" }
      - { label: "URL de la Fuente Original", name: "source_url", widget: "string", required: false }
      - { label: "Cuerpo de la Noticia", name: "body", widget: "markdown" }
