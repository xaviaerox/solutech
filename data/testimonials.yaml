- name: Antonio R.
  role: Propietario · Distribuidora Agrícola — Almería
  initial: A
  text: "Llevamos 10 meses con el plan de Gestión MSP. Desde que Xavi implementó el sistema de monitorización, resolvimos 3 incidencias antes de que afectaran a nuestras operaciones. Un martes nos avisó él de que un servidor estaba al 95% de disco. Lo resolvimos en 2 horas sin que ningún empleado se enterara."

- name: Lucía M.
  role: Directora · Consultoría Financiera — Murcia
