- name: Conchi M.
  role: Propietaria · Residencia Unifamiliar (4 Plantas) — Almería
  initial: C
  text: "Contratamos a Xavi para realizar la instalación completa de las tomas y cableado RJ45 en nuestra vivienda unifamiliar de 4 plantas. Dejó cada punto verificado y ordenado, dando servicio de red impecable a toda la casa. Da gusto trabajar con alguien tan profesional."

- name: Miguel A.
  role: Director de Operaciones · Climatización y Soluciones Técnicas — Murcia
  initial: M
  text: "Le encargamos el desarrollo de un software de gestión de stock interno y logística adaptado a nuestra operativa y a la nueva normativa Veri*Factu. Entendió nuestras necesidades a la perfección y nos entregó una herramienta privada que nos ahorra horas cada semana."

- name: Rafael G.
  role: Gerente · Instalaciones y Servicios — Almería
  initial: R
  text: "Se nota de inmediato su larga experiencia en telecomunicaciones e infraestructura de red. Reorganizó todo nuestro rack de comunicaciones, corrigió fallos de conectividad que arrastrábamos de tiempo atrás y nos dejó la red 100% estable y bien documentada."
