- name: Carlos D.
  role: Director · Asesoría Contable — Almería
  initial: C
  text: "Necesitábamos cumplir con el RGPD para una inspección inminente. Xavi completó la auditoría, implementó los controles técnicos y nos entregó la documentación en Wiki.js lista para mostrar. Pasamos la inspección sin ningún problema. Ahora es nuestro departamento IT de facto."
