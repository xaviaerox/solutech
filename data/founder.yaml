name: Xavi Alonso
role: Operador IT & Arquitecto de Infraestructura
location: Almería · Murcia · Remoto
bio: |
  Especialista en infraestructuras críticas, ciberseguridad y arquitectura cloud con más de 12 años de trayectoria en el sector IT. A lo largo de mi carrera, he diseñado e implementado soluciones tecnológicas para empresas de diversos sectores, desde pequeñas startups hasta entornos corporativos complejos.

  Fundé Solutech con una misión clara: democratizar la informática de alto nivel y transformarla en una ventaja operativa invisible para las pequeñas empresas. Mi enfoque se aleja del modelo tradicional de 'paga y repara'; me centro en la prevención, el diseño de sistemas resilientes y la monitorización proactiva 24/7.

  Cuento con certificaciones de la industria como Cisco CCNA, Google Cybersecurity y CompTIA A+, lo que me permite abordar los retos tecnológicos con un enfoque holístico. No solo soluciono problemas; construyo infraestructuras que garantizan la continuidad real del negocio, la seguridad de los datos y el cumplimiento normativo (RGPD), operando con el rigor y la documentación de un departamento IT de gran empresa.
values:
  - title: Tecnología Silenciosa
    desc: El éxito de mi trabajo es que te olvides de que existo. Monitorización activa y prevención para que tu operativa nunca se detenga.
    icon: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
  - title: Arquitectura de Continuidad
    desc: No parcheamos. Construimos infraestructuras estables basadas en backups verificados, seguridad perimetral y procesos automatizados.
    icon: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
  - title: Partner IT Externo
    desc: Funcionamos como tu propio departamento técnico. Documentación clara (Wiki.js), soporte directo y visión estratégica para tu crecimiento.
    icon: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
